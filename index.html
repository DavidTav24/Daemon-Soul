<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; connect-src 'self' https://cdn.jsdelivr.net data: blob:; img-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
  >
  <title>Ashgate</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #14110e;
      color: #f3e6d0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 { font-weight: 600; letter-spacing: 0.08em; margin-bottom: 0.25rem; }
    p { margin-top: 0; }
    pre {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 15px;
      line-height: 1.15;
      white-space: pre;
      overflow-x: auto;
      background: #1c1814;
      border-radius: 8px;
      padding: 0.75rem;
    }
    #status { min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>ASHGATE</h1>
    <p id="status">Loading the gates…</p>
    <pre id="frame" tabindex="0" aria-label="Ashgate game"></pre>
  </main>
  <script
    src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"
    integrity="sha384-Jbsp01bfi5QMUu9TQeO+5kXvBTqk5CQkcSgbSP9rSEDuQnaamwBF7YDKrSsBmfXw"
    crossorigin="anonymous"
  ></script>
  <script src="play.js"></script>
</body>
</html>
