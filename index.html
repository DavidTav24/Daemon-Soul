<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; connect-src 'self' https://cdn.jsdelivr.net data: blob:; img-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
  >
  <title>Daemon soul</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #14110e;
      color: #f3e6d0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 { font-weight: 600; letter-spacing: 0.08em; margin-bottom: 0.25rem; }
    p { margin-top: 0; }
    #frame {
      position: relative;
      width: 462px;
      height: 264px;
      overflow: hidden;
      border: 1px solid #c4b49a;
    }
    #frame .sky { position: absolute; inset: 0; display: block; }
    #frame .grid { position: absolute; inset: 0; }
    #frame .row { display: flex; height: 22px; }
    #frame .tile { width: 22px; height: 22px; }
    #frame .caption {
      position: absolute;
      top: 48px;
      left: 36px;
      margin: 0;
      color: darkgreen;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-weight: 700;
      letter-spacing: 0.12em;
      white-space: pre;
      line-height: 22px;
    }
    #status { min-height: 1.2em; font-family: ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Daemon soul</h1>
    <p id="status">Loading the gates…</p>
    <div id="frame" tabindex="0" aria-label="Daemon soul"></div>
  </main>
  <script
    src="https://cdn.jsdelivr.net/pyodide/v0.27.0/full/pyodide.js"
    integrity="sha384-Jbsp01bfi5QMUu9TQeO+5kXvBTqk5CQkcSgbSP9rSEDuQnaamwBF7YDKrSsBmfXw"
    crossorigin="anonymous"
  ></script>
  <script src="play.js"></script>
</body>
</html>
